name: Vérification des alertes Nanobiotix

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les alertes et notifier Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_alerts.py

      - name: Sauvegarder l'état des alertes
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerts_state.json
          if git diff --staged --quiet; then
            echo "Aucun changement à sauvegarder."
            exit 0
          fi
          git commit -m "Update alerts state [skip ci]"
          delay=5
          for i in 1 2 3 4 5 6; do
            if git push; then
              echo "Push réussi (tentative $i)."
              exit 0
            fi
            echo "Échec du push (tentative $i/6) — nouvel essai dans ${delay}s..."
            sleep $delay
            delay=$((delay * 2))
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
          echo "::warning::Échec de la sauvegarde de l'état des alertes après plusieurs tentatives — la prochaine vérification repartira de l'état précédent."
          exit 1
